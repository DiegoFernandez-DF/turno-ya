{% extends "base.html" %}

{% block title %}Iniciar sesión — TurnoYa{% endblock %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">

        <div class="card shadow-sm">
            <div class="card-body">

                <h1 class="h4 mb-4 text-center">
                    Iniciar sesión
                </h1>

                <form method="post">
                    {% csrf_token %}

                    {{ form.as_p }}

                    <button type="submit" class="btn btn-success w-100">
                        Iniciar sesión
                    </button>
                </form>

            </div>
        </div>

    </div>
</div>

{% endblock %}
